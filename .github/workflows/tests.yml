name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Headless runner: no terminal window or sound device for the log server
      LOG_DISPLAY_MODE: background
      ENABLE_SOUND_NOTIFICATIONS: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (torch wheels are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        # pyproject excludes `live` tests (need Ollama, a real browser or npx MCP servers)
        run: uv run pytest -q
